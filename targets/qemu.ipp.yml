# Target for general virtualized images (typically for qemu)
version: '2'
mpp-vars:
  use_initrd: dracut-autoinit
  static_ip_iface: "enp0s2"
  static_ip_modules:
    - "virtio_net"
  consoles:
    mpp-if: arch == 'aarch64'
    then: "ttyAMA0 tty0"
    else: "ttyS0 tty0"
  autoinit_load_modules:
    - nvme
    - virtio_mmio
  initrd_modules:
    mpp-join:
      - mpp-eval: initrd_modules
      - - "nvme"
        - "nvme_common"
        - "nvme_core"
        - "virtio_blk"
        - "virtio_mmio"
        - "sd_mod"
        - "ahci"
  # Keep dracut's restricted driver selection for this target.
  dracut_drivers:
    mpp-join:
      - mpp-eval: dracut_drivers
      - mpp-eval: initrd_modules
