# Target for systems compliant with the EBBR Specification
#
# This target defines a generic "ebbr" target fragment for boards that
# follow the Embedded Base Boot Requirements (EBBR) specification.
#
# References
#   EBBR specification: https://arm-software.github.io/ebbr/
#   U-Boot: https://www.denx.de/wiki/U-Boot
#
# PURPOSE: Production
# This is the recommended target for production environments. It produces
# a standardized, hardware-agnostic OS image that can boot on any
# EBBR-compliant board (TI, NXP, Renesas, etc.).
#
# REQUIREMENTS:
# This image does NOT include low-level bootloaders. Before use:
# 1. Flash the board-specific firmware (U-Boot/SPL) to the board's
#    internal memory (SPI NOR or eMMC boot partitions).
# 2. Set board DIP switches to "Internal Flash" or "SPI" boot mode.
#
# U-Boot itself provides the features (device tree handling, kernel boot
# chaining, console selection, boot scripts, environment) that allow a
# platform to meet EBBR requirements, but compliance is not automatic
# out-of-the-box.

version: '2'
mpp-vars:
  target_supported_arches:
    - aarch64
    - x86_64 # TODO: This is used in a test atm, so allow it even if its weird
  use_autoinit: true
  # EBBR-compliant boards provide the console via device tree stdout-path,
  # so no hardcoded console= kernel arguments are needed.
  consoles: ''
