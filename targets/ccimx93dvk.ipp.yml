version: '2'
mpp-vars:
  use_boot: none
  use_bootpart: true
  use_efi_runtime: false
  consoles: "ttyLP5,115200"
  image_size: 3221225472
  dracut_compression: "lzo"
  initrd_modules:
    mpp-join:
      - mpp-eval: initrd_modules
      - - "mmc_block"
        - "mmc_core"
        - "sdhci-esdhc-imx"
  # Keep dracut's restricted driver selection for this target.
  dracut_drivers:
    mpp-join:
      - mpp-eval: dracut_drivers
      - mpp-eval: initrd_modules
  dracut_modules:
    - "base"
    - "bash"
    - "dracut-systemd"
    - "fs-lib"
    - "kernel-modules"
    - "rootfs-block"
    - "shutdown"
    - "systemd"
    - "systemd-initrd"
    - "terminfo"
    - "udev-rules"
pipelines: []
